# Product Tracker 配置文件
# 定期拉取产品发现平台数据并生成分析报告

# 基础配置（版本号由 main.py 单一维护，此处不再重复）
app:
  name: "Product Tracker"
  data_dir: "./data"        # 相对路径按项目根目录解析
  reports_dir: "./reports"

# 定时任务配置
scheduler:
  enabled: true
  # 启动 schedule 命令后立即跑一次，而不是等到下一个时间点
  run_on_start: true
  # use_cron 为 true 时按 cron_expression 执行，否则按 interval_minutes
  use_cron: false
  cron_expression: "0 9 * * *"   # 每天 09:00
  interval_minutes: 1440         # 24小时

# 平台配置
# rate_limit: 同一平台两次请求的最小间隔（秒）
# timeout/max_retries: 单次请求超时与重试次数
#
# 按"打榜 / 早期 / 开发者 / 社区"分为四组，与 platforms.PLATFORM_GROUPS 一致。
platforms:
  # ==================== 一、打榜与每日精选 ====================

  producthunt:
    enabled: true
    name: "Product Hunt"
    base_url: "https://www.producthunt.com"
    # 官方 Atom feed，比抓取页面稳定；票数通过官方 featured.svg 徽章补齐
    feed_url: "https://www.producthunt.com/feed"
    # feed 不可用时的回退数据源（无票数）
    alternative_source: "https://hunted.space"
    enrich_votes: true       # 用 featured.svg 补票数，解锁热度分与「较上次」
    vote_workers: 8          # 补票并发数
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 50

  fazier:
    enabled: true
    name: "Fazier"
    base_url: "https://fazier.com"
    # 首页把当日 / 本周 / 本月三组榜单内联在 __NEXT_DATA__ 里，直接取 JSON；
    # 带票数与评论数，是少数能拿到票数的打榜平台
    periods:
      - "posts"          # 当日
      - "weeklyPosts"    # 本周
      - "monthlyPosts"   # 本月
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 40

  startupage:
    enabled: true
    name: "StartuPage"
    base_url: "https://startupa.ge"
    # 按 Stripe 验证的月收入（MRR）排名的启动榜单，衡量"真实收入"而非一日热度
    list_path: "/leaderboard?tab=startups"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 30

  # Cloudflare 整站拦截，需在下方 proxy 段配置稳定出口的代理后再启用
  uneed:
    enabled: false
    name: "Uneed"
    base_url: "https://www.uneed.best"
    rate_limit: 3
    timeout: 30
    max_retries: 1           # 403 不在重试白名单里，多试无益
    max_items: 40

  # 同上：Cloudflare 整站拦截
  microlaunch:
    enabled: false
    name: "MicroLaunch"
    base_url: "https://microlaunch.net"
    # 专为 Micro-SaaS 设计，曝光周期长达一个月
    rate_limit: 3
    timeout: 30
    max_retries: 1
    max_items: 30

  # 纯客户端渲染，HTML 内不含榜单数据，HTTP 采集不到；需无头浏览器才有意义
  peerlist:
    enabled: false
    name: "Peerlist Launchpad"
    base_url: "https://peerlist.io"
    list_path: "/launchpad"
    rate_limit: 3
    timeout: 30
    max_retries: 1
    max_items: 30

  # ==================== 二、早期与内测阶段 ====================

  betalist:
    enabled: true
    name: "BetaList"
    base_url: "https://betalist.com"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 30

  betabound:
    enabled: true
    name: "Betabound"
    base_url: "https://www.betabound.com"
    # 官方 RSS，一次 10 条；偏向招募真实测试员做深度体验与反馈
    feed_url: "https://www.betabound.com/feed/"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 30

  # ==================== 三、开发者与技术社区 ====================

  hackernews:
    enabled: true
    name: "Hacker News"
    base_url: "https://news.ycombinator.com"
    # Algolia 搜索 API：一次请求即可拿到票数与评论数
    search_endpoint: "https://hn.algolia.com/api/v1"
    # Algolia 不可用时回退到官方 API（需逐条请求，较慢）
    api_endpoint: "https://hacker-news.firebaseio.com/v0"
    # 只取最近 N 天的 Show HN
    window_days: 7
    rate_limit: 1
    timeout: 30
    max_retries: 3
    max_items: 40

  devhunt:
    # 站点 2025 年改版后已恢复可用（旧版全站返回错误页，曾默认关闭）
    enabled: true
    name: "DevHunt"
    base_url: "https://devhunt.org"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 40

  github_trending:
    enabled: true
    name: "GitHub Trending"
    base_url: "https://github.com"
    # 榜单周期，可选 daily / weekly / monthly
    periods:
      - "daily"
      - "weekly"
    # 语言筛选，空字符串表示全部语言；可加 "python"、"rust" 等
    languages:
      - ""
    rate_limit: 2
    timeout: 30
    max_retries: 3
    max_items: 30

  # ==================== 四、独立创作者社区与国内平台 ====================

  indiehackers:
    enabled: true
    name: "Indie Hackers"
    base_url: "https://www.indiehackers.com"
    # 产品卡片带 Stripe 验证的月收入（MRR），唯一带真实营收维度的数据源
    list_path: "/products"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 30

  xinquji:
    enabled: true
    name: "新趣集"
    base_url: "https://xinquji.com"
    # 官方 RSS，一次 20 条；国内"中国版 Product Hunt"
    feed_url: "https://xinquji.com/rss"
    rate_limit: 3
    timeout: 30
    max_retries: 3
    max_items: 30

# 分析配置
analysis:
  # 与过去多少天的数据对比，用于识别新品与关键词涨跌
  trend_window_days: 7
  # 全站热门榜条目数
  top_products_limit: 20
  # 需要跟踪的关键词（报告中的"趋势分析"部分）
  keywords:
    - "AI"
    - "agent"
    - "SaaS"
    - "developer tools"
    - "productivity"
    - "automation"
    - "open source"
    - "no-code"
  # 默认生成的报告格式，命令行 --format 可覆盖
  report_formats:
    - "html"
    - "json"
    - "markdown"
  # 数据与报告的保留天数，超期由 clean 命令或每次运行后自动清理
  retention_days: 90

# 通知配置（暂未实现）
notifications:
  enabled: false
  channels: []

# 代理配置（可选），开启后对所有平台生效
# 启用 uneed / microlaunch 等被 Cloudflare 拦截的平台时，需要在这里配置稳定出口的代理
proxy:
  enabled: false
  http: ""
  https: ""

# 日志配置
logging:
  level: "INFO"           # DEBUG / INFO / WARNING / ERROR
  file: "./logs/tracker.log"
  max_size_mb: 10
  backup_count: 5
